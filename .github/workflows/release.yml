name: Release

# Compila los instaladores y los publica en la GitHub Release al etiquetar
# una versión (v*). Con workflow_dispatch solo se construyen los artefactos
# (para probar sin publicar nada).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Instaladores — ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 a propósito, no `ubuntu-latest`: el binario hereda la
          # glibc del runner (24.04 pide 2.39 y no arranca en Zorin 17, Debian 12
          # ni Ubuntu 22.04). Con 22.04 el mínimo es glibc 2.35 y funciona en
          # todas las distros actuales.
          - os: ubuntu-22.04
            nombre: Linux
            bundles: deb,rpm,appimage
          - os: windows-latest
            nombre: Windows
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        # libfuse2 y patchelf hacen falta para generar el AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential libssl-dev libxdo-dev pkg-config \
            libfuse2 patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compilar instaladores
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Subir instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.nombre }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publicar en GitHub Releases
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Reunir instaladores de todas las plataformas
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Calcular sumas SHA-256
        run: |
          # Con nombres planos (sin las subcarpetas deb/, rpm/…), que es como
          # quedan los ficheros al subirlos a la release.
          find dist -type f -print0 | sort -z | xargs -0 sha256sum \
            | sed -E 's#  .*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Crear la release con los instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          # Los artefactos llegan con su subcarpeta (deb/, rpm/, msi/…), así que
          # hay que subir los ficheros, no los directorios.
          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No se encontró ningún instalador en dist/" >&2
            exit 1
          fi
          assets+=(SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --generate-notes --title "Downlink $tag"
          fi
